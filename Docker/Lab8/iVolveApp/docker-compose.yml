services:
  app:
    build:
      context: .
      network: host
    container_name: ivolve-app
    ports:
      - "3000:3000"
    environment:
      DB_HOST: db
      DB_USER: ivolveuser
      DB_PASSWORD: ivolvepass
      DB_NAME: ivolve
    volumes:
      - app_logs:/app/logs
    depends_on:
      - db
    networks:
      - ivolve-net

  db:
    image: mysql:8.0
    container_name: ivolve-db
    environment:
      MYSQL_ROOT_PASSWORD: rootpass123
      MYSQL_DATABASE: ivolve
      MYSQL_USER: ivolveuser
      MYSQL_PASSWORD: ivolvepass
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - ivolve-net

volumes:
  app_logs:
  db_data:

networks:
  ivolve-net:
    driver: bridge
